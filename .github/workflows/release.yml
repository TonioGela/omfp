# ENV-060: the downloads without Nix (docs/specs/01-dev-environment.md, "Release packages"). A pushed tag `v<version>`
# (the workspace version) builds them in the dev shell (`just package-linux`, `just package-macos`) and attaches them,
# with their SHA256SUMS and notes from the tag's Conventional Commits, to a draft GitHub release; publishing it stays a
# human step. Run by hand (workflow_dispatch) it is a dry run: the packages are the run's artifacts, no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # On a tag the packages check that it names the workspace version (contrib/release/lib.sh).
  OMFP_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  linux:
    name: Linux x86_64 (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just package-linux
      - uses: actions/upload-artifact@v7
        with:
          name: omfp-linux-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS arm64 (omfp.app)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Without the Apple secrets the app is signed ad-hoc (ENV-063).
      - run: nix develop -c just package-macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: omfp-macos-arm64
          path: dist/
          if-no-files-found: error

  release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes need the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          contrib/release/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --draft --verify-tag --title "omfp $TAG" --notes-file "$RUNNER_TEMP/notes.md"
