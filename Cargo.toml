[workspace]
resolver = "3"
members = ["crates/*", "xtask", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
pmo-core = { path = "crates/pmo-core" }
pmo-protocol = { path = "crates/pmo-protocol" }
pmo-daemon = { path = "crates/pmo-daemon" }
fake-llm = { path = "crates/fake-llm" }
pmo-testkit = { path = "crates/pmo-testkit" }

# omp RPC client: the tag MUST match the oh-my-pi flake input and pmo_core::OMP_VERSION (ENV-010).
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.18.6" }

# UI: dioxus minor MUST match `dx`, wasm-bindgen MUST equal the shell's wasm-bindgen-cli (ENV-012).
dioxus = { version = "0.7.10" }
wasm-bindgen = "=0.2.130"

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "string"] }
futures = "0.3"
insta = { version = "1", features = ["json"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "io-util",
  "process",
  "signal",
] }
tokio-stream = "0.1"
toml = "1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
