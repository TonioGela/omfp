[workspace]
resolver = "3"
members = ["crates/*", "xtask", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
omfp-core = { path = "crates/omfp-core" }
omfp-protocol = { path = "crates/omfp-protocol" }
omfp-client = { path = "crates/omfp-client" }
omfp-daemon = { path = "crates/omfp-daemon" }
fake-llm = { path = "crates/fake-llm" }
omfp-testkit = { path = "crates/omfp-testkit" }

# omp RPC client: the tag MUST match the oh-my-pi flake input and omfp_core::OMP_VERSION (ENV-010).
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.18.6" }

# UI: dioxus minor MUST match `dx`, wasm-bindgen MUST equal the shell's wasm-bindgen-cli (ENV-012).
dioxus = { version = "0.7.10" }
wasm-bindgen = "=0.2.130"
# Browser bindings: versions move in lockstep with wasm-bindgen (pinned above).
js-sys = "0.3.107"
web-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"
wasm-bindgen-test = "0.3.80"
gloo-timers = { version = "0.3", features = ["futures"] }
# UI rendering and tests
ammonia = "4"
dioxus-ssr = "0.7.10"
pulldown-cmark = { version = "0.13", default-features = false, features = [
  "html",
] }
scraper = "0.29"
thirtyfour = "0.38"

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "string"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
insta = { version = "1", features = ["json"] }
proptest = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "io-util",
  "process",
  "signal",
] }
tokio-stream = "0.1"
tokio-tungstenite = "0.30"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
