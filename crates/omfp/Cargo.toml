[package]
name = "omfp"
description = "The `omfp` binary (D-15): `omfp daemon` runs the daemon, `omfp theme set` sets the UI theme, `omfp desktop` opens a desktop window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The command line's library: the protocol client and the subcommands, used by the binary and its tests.
[lib]
name = "omfp"
path = "src/lib.rs"

# The single binary (D-15).
[[bin]]
name = "omfp"
path = "src/main.rs"
doc = false

[features]
# `omfp desktop` (M7): links WebKitGTK through Tauri; daemon-only builds leave it off.
desktop = ["dep:tauri", "dep:tauri-build", "dep:gio"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
gio = { workspace = true, optional = true }
omfp-daemon.workspace = true
omfp-protocol.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tokio.workspace = true
tokio-tungstenite.workspace = true

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
omfp-core.workspace = true
rustix.workspace = true
tempfile.workspace = true

[lints]
workspace = true
