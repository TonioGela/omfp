[package]
name = "omfp"
description = "The `omfp` binary (D-15): `omfp daemon` runs the daemon, `omfp theme set` sets the UI theme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The command line's library: the protocol client and the subcommands, used by the binary and its tests.
[lib]
name = "omfp"
path = "src/lib.rs"

# The single binary (D-15).
[[bin]]
name = "omfp"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
omfp-daemon.workspace = true
omfp-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
omfp-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
