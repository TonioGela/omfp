[graph]
all-features = false

[advisories]
# Vulnerabilities fail; unmaintained crates are only reported for direct workspace dependencies.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  # Permissive data license of the Mozilla CA roots (`webpki-root-certs`, via thirtyfour's reqwest in `e2e` only).
  "CDLA-Permissive-2.0",
  "MIT",
  # File-level copyleft, unmodified upstream use only: option-ext (via thirtyfour's `dirs` in `e2e` only).
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Workspace crates are GPL-3.0-or-later and unpublished; only third-party licenses are checked.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# omp-rpc comes from the pinned oh-my-pi release tag (ENV-010).
allow-git = ["https://github.com/can1357/oh-my-pi"]
